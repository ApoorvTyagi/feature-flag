# docker-compose.yml
version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: feature_flag_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: featureflags
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: feature_flag
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/featureflags
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password

volumes:
  mysql_data:
