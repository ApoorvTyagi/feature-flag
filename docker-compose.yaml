# docker-compose.yml
version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: feature_flag_mysql_another
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: featureflags
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/migration/v1__init.sql:/docker-entrypoint-initdb.d/v1__init.sql

  app:
    build: .
    container_name: feature_flag_another
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/featureflags
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      
volumes:
  mysql_data:
